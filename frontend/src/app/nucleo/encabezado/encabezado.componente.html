<header class="encabezado">
  <div class="contenedor-encabezado">

    <!-- Logo -->
    <a routerLink="/" class="logo">
      <svg class="logo-conejo" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="22" cy="14" rx="5" ry="12" fill="#fcf3f2" stroke="#3c1213" stroke-width="2"/>
        <ellipse cx="22" cy="14" rx="2.5" ry="7" fill="#f5a1b8"/>
        <ellipse cx="38" cy="14" rx="5" ry="12" fill="#fcf3f2" stroke="#3c1213" stroke-width="2"/>
        <ellipse cx="38" cy="14" rx="2.5" ry="7" fill="#f5a1b8"/>
        <circle cx="30" cy="36" r="18" fill="#fcf3f2" stroke="#3c1213" stroke-width="2"/>
        <circle cx="24" cy="34" r="1.8" fill="#3c1213"/>
        <circle cx="36" cy="34" r="1.8" fill="#3c1213"/>
        <circle cx="21" cy="39" r="2.5" fill="#f5a1b8" opacity="0.7"/>
        <circle cx="39" cy="39" r="2.5" fill="#f5a1b8" opacity="0.7"/>
        <path d="M30 38 L28 40 M30 38 L32 40" stroke="#3c1213" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M28 40 Q30 42 32 40" stroke="#3c1213" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      </svg>
      <div class="logo-texto">
        <span class="logo-nombre">Migurumi</span>
        <span class="logo-sub">• Store •</span>
      </div>
    </a>

    <!-- Navegación -->
    <nav class="nav-menu">
      <a routerLink="/" routerLinkActive="activo" [routerLinkActiveOptions]="{exact: true}">Inicio</a>
      <a routerLink="/tienda" routerLinkActive="activo">Tienda</a>
      <a routerLink="/personalizados" routerLinkActive="activo">Personalizados</a>
      <a routerLink="/nosotros" routerLinkActive="activo">Sobre mí</a>
      <a routerLink="/contacto" routerLinkActive="activo">Contacto</a>
    </nav>

    <!-- Acciones -->
<div class="acciones">

  <!-- Usuario NO logueado -->
  <a *ngIf="!auth.estaAutenticado()" routerLink="/login" class="login-link">
    Iniciar sesión
  </a>

  <!-- Usuario logueado -->
  <div *ngIf="auth.estaAutenticado()" class="usuario-menu">
  <a routerLink="/perfil" class="icono-btn" aria-label="Mi cuenta" title="Mi cuenta">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>
    </svg>
  </a>
</div>

  <!-- Panel de administración (solo admins) -->
  <a *ngIf="auth.esAdmin()" routerLink="/admin/gestion-productos" class="icono-btn admin-btn"
     aria-label="Panel de administración" title="Panel de administración">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z"/>
    </svg>
  </a>

  <!-- Carrito -->
  <a routerLink="/carrito" class="icono-btn" aria-label="Carrito" title="Carrito">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="21" r="1"/>
      <circle cx="20" cy="21" r="1"/>
      <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
    </svg>
    <span class="cart-count" *ngIf="carrito.cantidadTotal() > 0">
    {{ carrito.cantidadTotal() }}
  </span>
  </a>

    </div>
  </div>    
</header>

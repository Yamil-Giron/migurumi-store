<div class="auth-pagina">
  <div class="auth-card">
    <div class="auth-logo">
      <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="22" cy="14" rx="5" ry="12" fill="#fcf3f2" stroke="#3c1213" stroke-width="2"/>
        <ellipse cx="22" cy="14" rx="2.5" ry="7" fill="#f5a1b8"/>
        <ellipse cx="38" cy="14" rx="5" ry="12" fill="#fcf3f2" stroke="#3c1213" stroke-width="2"/>
        <ellipse cx="38" cy="14" rx="2.5" ry="7" fill="#f5a1b8"/>
        <circle cx="30" cy="36" r="18" fill="#fcf3f2" stroke="#3c1213" stroke-width="2"/>
        <circle cx="24" cy="34" r="1.8" fill="#3c1213"/>
        <circle cx="36" cy="34" r="1.8" fill="#3c1213"/>
        <circle cx="21" cy="39" r="2.5" fill="#f5a1b8" opacity="0.7"/>
        <circle cx="39" cy="39" r="2.5" fill="#f5a1b8" opacity="0.7"/>
        <path d="M28 40 Q30 42 32 40" stroke="#3c1213" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <h1>Crear cuenta</h1>
    <p class="auth-subtitulo">Únete a Migurumi Store</p>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="campo">
        <label for="nombre">Nombre completo</label>
        <input
          id="nombre"
          type="text"
          [(ngModel)]="nombre"
          name="nombre"
          placeholder="Tu nombre"
          required
        />
      </div>

      <div class="campo">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="tu@email.com"
          required
        />
      </div>

      <div class="campo">
        <label for="contrasena">Contraseña</label>
        <input
          id="contrasena"
          type="password"
          [(ngModel)]="contrasena"
          name="contrasena"
          placeholder="Mínimo 6 caracteres"
          required
        />
      </div>

      <div class="campo">
        <label for="confirmar">Confirmar contraseña</label>
        <input
          id="confirmar"
          type="password"
          [(ngModel)]="confirmar"
          name="confirmar"
          placeholder="Repite tu contraseña"
          required
        />
      </div>

      <div class="auth-error" *ngIf="error">{{ error }}</div>
      <div class="auth-exito" *ngIf="exito">{{ exito }}</div>

      <button type="submit" class="btn btn-primario btn-full" [disabled]="cargando">
        {{ cargando ? 'Creando cuenta...' : 'Registrarme' }}
      </button>
    </form>

    <p class="auth-pie">
      ¿Ya tienes cuenta?
      <a routerLink="/login">Inicia sesión</a>
    </p>
  </div>
</div>
